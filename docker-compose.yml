version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: core_bank_db
    environment:
      POSTGRES_DB: core_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - core_bank_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_bank"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Authentication Service
  authentication-service:
    build:
      context: ./Authentication-Service
      dockerfile: dockerfile
    container_name: authentication_service
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: corebankuser
      DB_PASSWORD: corebankpass
      DB_NAME: corebankdb
      DB_SSL_MODE: disable
      
      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8082
      
      # Application environment
      APP_ENV: development
      LOG_LEVEL: info
      
      # JWT configuration
      JWT_SECRET: eUhqLeLgicZs4KR39IGb0Kdj3hGI+VU+ZzicQhy3K0Y=
      JWT_EXPIRY: 24h
      
      # Password hashing
      BCRYPT_COST: 12
      
      # Redis configuration (for session management)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # External service URLs
      CUSTOMER_SERVICE_URL: http://customer-service:8080
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks:
      - core_bank_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Customer Service
  customer-service:
    build: 
      context: ./Customer-Service
      dockerfile: Dockerfile
    container_name: customer_service
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: corebankuser
      DB_PASSWORD: corebankpass
      DB_NAME: corebankdb
      DB_SSL_MODE: disable
      
      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      
      # Application environment
      APP_ENV: development
      LOG_LEVEL: info
      
      # JWT configuration
      JWT_SECRET: eUhqLeLgicZs4KR39IGb0Kdj3hGI+VU+ZzicQhy3K0Y=
      
      # External service URLs
      AUTHENTICATION_SERVICE_URL: http://authentication-service:8082
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core_bank_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Account Service
  account-service:
    build:
      context: ./Account-Service
      dockerfile: Dockerfile
    container_name: account_service
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: corebankuser
      DB_PASSWORD: corebankpass
      DB_NAME: corebankdb
      DB_SSL_MODE: disable
      
      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8081
      
      # Application environment
      APP_ENV: development
      LOG_LEVEL: info
      
      # JWT configuration
      JWT_SECRET: eUhqLeLgicZs4KR39IGb0Kdj3hGI+VU+ZzicQhy3K0Y=
      
      # External service URLs
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      AUTHENTICATION_SERVICE_URL: http://authentication-service:8082
    ports:
      - "8081:8081"
    depends_on:
      customer-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - core_bank_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Transaction Service
  transaction-service:
    build:
      context: ./Transaction-Service
      dockerfile: Dockerfile
    container_name: transaction_service
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: corebankuser
      DB_PASSWORD: corebankpass
      DB_NAME: corebankdb
      DB_SSL_MODE: disable
      
      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8083
      
      # Application environment
      APP_ENV: development
      LOG_LEVEL: info
      
      # JWT configuration
      JWT_SECRET: eUhqLeLgicZs4KR39IGb0Kdj3hGI+VU+ZzicQhy3K0Y=
      
      # External service URLs
      ACCOUNT_SERVICE_URL: http://account-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      
      # Kafka configuration
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: account-balance-update
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy
    networks:
      - core_bank_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: core_bank_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - core_bank_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PgAdmin (Database management UI)
  pgadmin:
    image: dpage/pgadmin4
    container_name: core_bank_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - core_bank_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # API Gateway (Nginx reverse proxy)
  api-gateway:
    image: nginx:alpine
    container_name: core_bank_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - authentication-service
      - customer-service
      - account-service
    networks:
      - core_bank_network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: core_bank_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - core_bank_network
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: core_bank_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - core_bank_network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./prometheus/grafana-provisioning/:/etc/grafana/provisioning/
      - ./prometheus/grafana-provisioning/dashboards/account-service-dashboard.json:/etc/grafana/provisioning/dashboards/account-service-dashboard.json
      - ./prometheus/grafana-provisioning/dashboards/authentication-service-dashboard.json:/etc/grafana/provisioning/dashboards/authentication-service-dashboard.json
      - ./prometheus/grafana-provisioning/dashboards/customer-service-dashboard.json:/etc/grafana/provisioning/dashboards/customer-service-dashboard.json
      - ./prometheus/grafana-provisioning/dashboards/transaction-service-dashboard.json:/etc/grafana/provisioning/dashboards/transaction-service-dashboard.json

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  # Add ZooKeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: core_bank_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - core_bank_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Add Kafka
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: core_bank_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - core_bank_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  core_bank_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
