apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: core-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        version: v1
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          DATA_DIR=/var/lib/kafka/data
          CONFIG=/tmp/kraft.properties
          mkdir -p ${DATA_DIR}
          echo "Creating KRaft server properties at ${CONFIG}"
          cat > ${CONFIG} <<EOF
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:9093
          listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          advertised.listeners=PLAINTEXT://kafka.core-bank.svc.cluster.local:9092
          listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          log.dirs=${DATA_DIR}
          auto.create.topics.enable=true
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          num.partitions=1
          group.initial.rebalance.delay.ms=0
          EOF
          if [ -f "${DATA_DIR}/meta.properties" ]; then
            echo "meta.properties exists; skipping format"
          else
            echo "Formatting storage with cluster id ${KAFKA_CLUSTER_ID}"
            /usr/bin/kafka-storage format -t ${KAFKA_CLUSTER_ID} -c ${CONFIG}
          fi
          echo "Starting Kafka broker"
          exec /usr/bin/kafka-server-start ${CONFIG}
        ports:
        - containerPort: 9092
        - containerPort: 9093
        env:
        - name: KAFKA_CLUSTER_ID
          value: "WHUYTAUFRdyM63Rj0YoKJw=="
        - name: KAFKA_HEAP_OPTS
          value: "-Xms256m -Xmx512m"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 20
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9092
          failureThreshold: 60
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1"
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: core-bank
spec:
  selector:
    app: kafka
  ports:
    - name: kafka-port
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: controller-port
      protocol: TCP
      port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: core-bank
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 5Gi