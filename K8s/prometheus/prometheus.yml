global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Example: scrape metrics from microservices if they expose /metrics
  - job_name: 'account-service'
    static_configs:
      - targets: ['account-service:8081']

  - job_name: 'authentication-service'
    static_configs:
      - targets: ['authentication-service:8082']

  - job_name: 'customer-service'
    static_configs:
      - targets: ['customer-service:8080']

  - job_name: 'transaction-service'
    static_configs:
      - targets: ['transaction-service:8083']
