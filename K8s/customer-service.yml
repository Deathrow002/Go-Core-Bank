apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: core-bank
  labels:
    app: customer-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        version: v1
    spec:
      containers:
      - name: customer-service
        image: customer-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "corebankuser"
        - name: POSTGRES_PASSWORD
          value: "corebankpass"
        - name: POSTGRES_DB
          value: "corebankdb"
        - name: DATABASE_URL
          value: "postgres://corebankuser:corebankpass@postgres:5432/corebankdb?sslmode=disable"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8082"
        ports:
        - containerPort: 8082
        # Probes for better lifecycle management
        startupProbe:
          httpGet:
            path: /health
            port: 8082
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for Postgres..."; sleep 5; done']
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka.core-bank.svc.cluster.local 9092; do echo "Waiting for Kafka..."; sleep 5; done']
      - name: wait-for-account-service
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z account-service.core-bank.svc.cluster.local 8080; do echo "Waiting for Account Service..."; sleep 5; done']
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
