events {
    worker_connections 1024;
}

http {
    upstream customer_service {
        server customer-service:8080;
    }
    
    upstream account_service {
        server account-service:8081;
    }

    # API Gateway configuration
    server {
        listen 80;
        server_name localhost;

        # Health check for gateway
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # Customer Service routes
        location /api/v1/customers {
            proxy_pass http://customer_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Account Service routes
        location /api/v1/accounts {
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct service health checks
        location /customer-service/health {
            proxy_pass http://customer_service/health;
        }

        location /account-service/health {
            proxy_pass http://account_service/health;
        }
    }
}